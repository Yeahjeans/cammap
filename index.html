<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMMAP — 동국대학교 캠퍼스 편의시설</title>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=YOUR_NCP_KEY_ID"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      padding: 16px 20px;
      background: #ff7a00;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .layout {
      display: flex;
      height: calc(100vh - 74px);
    }

    .sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 16px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-weight: 600;
    }

    button.active {
      background: #ff7a00;
      color: white;
    }

    .facility-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .facility-card {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
      cursor: pointer;
    }

    .facility-card:hover {
      background: #fff3e8;
      border-color: #ffb06a;
    }

    .facility-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .facility-card span {
      font-size: 13px;
      color: #666;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    .info-window {
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .info-window strong {
      display: block;
      margin-bottom: 4px;
      color: #ff7a00;
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        height: calc(100vh - 74px);
      }

      .sidebar {
        width: 100%;
        height: 230px;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      #map {
        height: calc(100vh - 304px);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>CAMMAP</h1>
    <p>동국대학교 캠퍼스 화장실 · 편의점 지도</p>

        <button id="storeBtn">편의점</button>

      <div id="facilityList" class="facility-list"></div>

    <div id="map"></div>

        building: "원흥관",
        floor: "건물 내부",
        lat: 37.5585639,

      },
      {
        id: "store_cu_dormitory",
        type: "store",
        name: "CU 동국대 기숙사점",
        building: "기숙사 인근",
        floor: "건물 내부",
        lat: 37.5602304,
        lng: 126.9997731
      },
      {
        id: "store_emart24_business",
        type: "store",
        name: "경영관 이마트24 편의점",
        building: "경영관",
        floor: "건물 내부",
        lat: 37.5570415,
        lng: 127.0029194
      }
    ];

    const map = new naver.maps.Map("map", {
      center: new naver.maps.LatLng(37.5582, 127.0008),
      zoom: 17,
      minZoom: 15,
      zoomControl: true,
      zoomControlOptions: {
        position: naver.maps.Position.TOP_RIGHT
      }
    });

    const markerMap = {};
    let currentInfoWindow = null;
    let currentFilter = "all";

    function getMarkerIcon(type) {
      const color = type === "toilet" ? "#2673ff" : "#ff7a00";
      const label = type === "toilet" ? "화" : "편";

      return {
        content: `
          <div style="
            width:34px;
            height:34px;
            border-radius:50%;
            background:${color};
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
            font-weight:800;
            border:3px solid white;
            box-shadow:0 2px 8px rgba(0,0,0,0.25);
          ">
            ${label}
          </div>
        `,
        size: new naver.maps.Size(34, 34),
        anchor: new naver.maps.Point(17, 17)
      };
    }

    function createMarkers() {
      facilities.forEach((facility) => {
        const marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(facility.lat, facility.lng),
          map: map,
          icon: getMarkerIcon(facility.type)
        });

        const infoWindow = new naver.maps.InfoWindow({
          content: `
            <div class="info-window">
              <strong>${facility.name}</strong>
              <div>${facility.building}</div>
              <div>${facility.floor}</div>
            </div>
          `
        });

        naver.maps.Event.addListener(marker, "click", () => {
          openInfoWindow(marker, infoWindow, facility);
        });

        markerMap[facility.id] = {
          marker,
          infoWindow,
          facility
        };
      });
    }

    function openInfoWindow(marker, infoWindow, facility) {
      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      infoWindow.open(map, marker);
      currentInfoWindow = infoWindow;

      map.panTo(new naver.maps.LatLng(facility.lat, facility.lng));
    }

    function renderList() {
      const list = document.getElementById("facilityList");
      list.innerHTML = "";

      const filteredFacilities = facilities.filter((facility) => {
        if (currentFilter === "all") return true;
        return facility.type === currentFilter;
      });

      filteredFacilities.forEach((facility) => {
        const card = document.createElement("div");
        card.className = "facility-card";

        const typeText = facility.type === "toilet" ? "화장실" : "편의점";

        card.innerHTML = `
          <strong>${facility.name}</strong>
          <span>${typeText} · ${facility.building} · ${facility.floor}</span>
        `;

        card.addEventListener("click", () => {
          const item = markerMap[facility.id];
          openInfoWindow(item.marker, item.infoWindow, facility);
        });

        list.appendChild(card);
      });
    }

    function applyFilter(filter) {
      currentFilter = filter;

      Object.values(markerMap).forEach(({ marker, facility }) => {
        if (filter === "all" || facility.type === filter) {
          marker.setMap(map);
        } else {
          marker.setMap(null);
        }
      });

      document.getElementById("allBtn").classList.toggle("active", filter === "all");
      document.getElementById("toiletBtn").classList.toggle("active", filter === "toilet");
      document.getElementById("storeBtn").classList.toggle("active", filter === "store");

      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      renderList();
    }

    document.getElementById("allBtn").addEventListener("click", () => applyFilter("all"));
    document.getElementById("toiletBtn").addEventListener("click", () => applyFilter("toilet"));
    document.getElementById("storeBtn").addEventListener("click", () => applyFilter("store"));

    createMarkers();
    renderList();
  </script>

</html>
